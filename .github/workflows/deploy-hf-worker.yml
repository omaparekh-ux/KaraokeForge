name: Deploy KaraokeForge ZeroGPU Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hf_space/**"
      - ".github/workflows/deploy-hf-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Create or update Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          repo_id = os.environ.get("HF_SPACE_ID")
          if not token or not repo_id:
              raise SystemExit("Set repository secrets HF_TOKEN and HF_SPACE_ID before running this workflow.")

          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
          )
          api.upload_folder(
              folder_path="hf_space",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy KaraokeForge ZeroGPU worker",
          )
          print(f"Deployed https://huggingface.co/spaces/{repo_id}")
          PY
