name: KaraokeForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall worker hf_space
      - run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for root in (Path("worker"), Path("hf_space")):
              for path in root.glob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("Python syntax OK")
          PY
